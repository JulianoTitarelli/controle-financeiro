```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Entrar - Controle Financeiro</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <header class="topo">

        <h1>
            Controle Financeiro
        </h1>

        <p>
            Acesse sua conta
        </p>

    </header>


    <main class="conteudo">

        <section class="formulario">

            <h2>
                Entrar
            </h2>


            <label for="email">
                E-mail
            </label>

            <input
                type="email"
                id="email"
                placeholder="seu@email.com"
                autocomplete="email"
            >


            <label for="senha">
                Senha
            </label>

            <input
                type="password"
                id="senha"
                placeholder="Sua senha"
                autocomplete="current-password"
            >


            <button id="entrar">
                ENTRAR
            </button>


            <button
                id="google"
                type="button"
            >
                CONTINUAR COM GOOGLE
            </button>


            <p
                id="mensagem"
                style="
                    margin-top: 15px;
                    text-align: center;
                    font-size: 14px;
                "
            ></p>

        </section>


        <a
            href="criar-conta.html"
            class="voltar"
        >
            Ainda não tenho uma conta
        </a>

    </main>


    <script
        type="module"
        src="js/login.js"
    ></script>

</body>

</html>
```
