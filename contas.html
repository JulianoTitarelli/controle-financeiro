<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Contas - Controle Financeiro</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <header class="topo">

        <h1>Minhas Contas</h1>

        <p>
            Contas e despesas
        </p>

    </header>


    <main class="conteudo">


        <!-- ========================= -->
        <!-- NOVA CONTA -->
        <!-- ========================= -->

        <section class="formulario">

            <h2>Nova conta</h2>


            <label for="descricao">
                Descrição
            </label>

            <input
                type="text"
                id="descricao"
                placeholder="Ex.: Conta de energia"
            >


            <label for="valor">
                Valor
            </label>

            <input
                type="number"
                id="valor"
                placeholder="0,00"
                step="0.01"
                min="0"
            >


            <label for="vencimento">
                Vencimento
            </label>

            <input
                type="date"
                id="vencimento"
            >


            <button id="salvarConta">
                ADICIONAR CONTA
            </button>

        </section>


        <!-- ========================= -->
        <!-- LISTA -->
        <!-- ========================= -->

        <section class="lista">

            <h2>
                Contas cadastradas
            </h2>

            <div id="listaContas">

                <p>
                    Carregando contas...
                </p>

            </div>

        </section>


        <!-- VOLTAR -->

        <a
            href="index.html"
            class="voltar"
        >
            Voltar para o início
        </a>


    </main>


    <script
        type="module"
        src="js/contas.js"
    ></script>

</body>

</html>
