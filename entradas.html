<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Entradas - Controle Financeiro</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <header class="topo">

        <h1>Minhas Entradas</h1>

        <p>Controle do dinheiro que entra</p>

    </header>


    <main class="conteudo">

        <section class="formulario">

            <h2>Nova entrada</h2>


            <label for="descricao">
                Descrição
            </label>

            <input
                type="text"
                id="descricao"
                placeholder="Ex.: Salário"
            >


            <label for="valor">
                Valor
            </label>

            <input
                type="number"
                id="valor"
                placeholder="0,00"
                step="0.01"
                min="0"
            >


            <label for="data">
                Data
            </label>

            <input
                type="date"
                id="data"
            >


            <button id="salvarEntrada">
                ADICIONAR ENTRADA
            </button>

        </section>


        <section class="lista">

            <h2>Entradas cadastradas</h2>

            <div id="listaEntradas">

                <p>
                    Carregando entradas...
                </p>

            </div>

        </section>

    </main>


    <script
        type="module"
        src="js/entradas.js"
    ></script>

</body>

</html>
