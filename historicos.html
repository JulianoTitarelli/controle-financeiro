<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Históricos - Controle Financeiro</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <header class="topo">

        <h1>
            Históricos
        </h1>

        <p>
            Consulte sua movimentação por mês
        </p>

    </header>


    <main class="pagina-historicos">


        <!-- ========================= -->
        <!-- SELEÇÃO DO MÊS -->
        <!-- ========================= -->

        <section class="seletor-mes">

            <h2>
                Selecionar mês
            </h2>

            <label for="mesSelecionado">
                Mês
            </label>

            <input
                type="month"
                id="mesSelecionado"
            >

        </section>


        <!-- ========================= -->
        <!-- RESUMO -->
        <!-- ========================= -->

        <section class="resumo-historico">

            <h2>
                Resumo do mês
            </h2>


            <div class="resumo-historico-card entrada">

                <span>
                    Entradas recebidas
                </span>

                <strong id="totalEntradasMes">
                    R$ 0,00
                </strong>

            </div>


            <div class="resumo-historico-card conta">

                <span>
                    Contas pagas
                </span>

                <strong id="totalContasMes">
                    R$ 0,00
                </strong>

            </div>


            <div class="resumo-historico-card resultado">

                <span>
                    Resultado do mês
                </span>

                <strong id="saldoMes">
                    R$ 0,00
                </strong>

            </div>

        </section>


        <!-- ========================= -->
        <!-- MOVIMENTAÇÕES -->
        <!-- ========================= -->

        <section class="movimentacoes-historico">

            <h2>
                Movimentações
            </h2>

            <div id="listaHistorico">

                <p class="sem-historico">
                    Selecione um mês.
                </p>

            </div>

        </section>


        <!-- ========================= -->
        <!-- VOLTAR -->
        <!-- ========================= -->

        <a
            href="index.html"
            class="voltar-historico"
        >
            Voltar para o início
        </a>


    </main>


    <script
        type="module"
        src="js/historicos.js"
    ></script>

</body>

</html>
